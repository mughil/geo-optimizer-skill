name: Frontend build

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'netlify.toml'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'netlify.toml'
      - '.github/workflows/frontend-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run generate:sitemap --prefix frontend
      - run: npm run build --prefix frontend
