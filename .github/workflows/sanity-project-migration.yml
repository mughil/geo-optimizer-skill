name: One-time Sanity project migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or import public articles and images
        required: true
        type: choice
        options:
          - preflight
          - apply
      source_project_id:
        description: Public source project ID
        required: true
        type: string
      target_project_id:
        description: Owned target project ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Migrate and verify Sanity content
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SOURCE_SANITY_PROJECT_ID: ${{ inputs.source_project_id }}
          TARGET_SANITY_PROJECT_ID: ${{ inputs.target_project_id }}
        run: node frontend/scripts/migrate-sanity-project.mjs "${{ inputs.mode }}"
